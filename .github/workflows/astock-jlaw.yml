name: astock-jlaw

# J Law 方法回测（2026-11-12 用户：学习香港教师 JLaw 的策略并转化）。只做研究，不改线上规则。
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-fxt796]
    paths: ["astock/jlaw.py", "scripts/astock_jlaw.py", "tests/test_astock_jlaw.py", ".github/workflows/astock-jlaw.yml"]

permissions:
  contents: write

concurrency:
  group: astock-jlaw
  cancel-in-progress: true

jobs:
  jlaw:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r astock/requirements.txt
      - run: python -m pytest -q tests/test_astock_jlaw.py
      - name: Restore price cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: data/astock/cache
          key: astock-kline-jlaw-fullfc
          restore-keys: astock-kline-
      - name: Make sure forecasts go back to 2014
        if: steps.restore.outputs.cache-matched-key != 'astock-kline-jlaw-fullfc'
        timeout-minutes: 120
        run: python scripts/astock_jlaw.py --ensure-forecast
      - name: Save price cache with full forecasts
        if: steps.restore.outputs.cache-matched-key != 'astock-kline-jlaw-fullfc'
        uses: actions/cache/save@v4
        with:
          path: data/astock/cache
          key: astock-kline-jlaw-fullfc
      - name: J Law backtest
        run: python scripts/astock_jlaw.py
      - name: Commit results
        run: |
          git config user.name "astock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/astock/jlaw.md docs/astock/jlaw.json data/research/jlaw_daily.csv.gz
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "astock: jlaw study $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
