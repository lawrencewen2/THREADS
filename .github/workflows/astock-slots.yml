name: astock-slots

# 带止盈止损的真实账户模拟（最多 20 只）。只读行情缓存，单独一个并发组。
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-pbwbl8]
    paths: ["astock/slots.py", "scripts/astock_slots.py", ".github/workflows/astock-slots.yml"]

permissions:
  contents: write

concurrency:
  group: astock-slots
  cancel-in-progress: false

jobs:
  slots:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r astock/requirements.txt
      - run: python -m pytest -q tests/test_astock_alt_study.py
      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: data/astock/cache
          key: astock-kline-${{ github.run_id }}
          restore-keys: astock-kline-
      - name: Slot portfolio with stops
        run: python scripts/astock_slots.py
      - name: Commit results
        run: |
          git config user.name "astock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/astock/slots.md docs/astock/slots.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "astock: slots study $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
