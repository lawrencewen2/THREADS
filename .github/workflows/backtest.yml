name: backtest

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["fearindex/**", "scripts/**", "tests/**", "requirements.txt", "!scripts/astock_*", "!tests/test_astock*.py", "!scripts/run_intraday.py"]

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_pipeline.py
      - run: python scripts/probe_qvix.py
