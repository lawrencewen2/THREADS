name: backtest

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["fearindex/**", "scripts/**", "tests/**", "requirements.txt"]

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Fetch history (uses committed cache when present)
        run: python scripts/run_daily.py || true
      - run: python scripts/run_backtest.py
      - name: Commit report and data
        run: |
          git config user.name "fear-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data docs README.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "report: backtest $(date -u +%F)"
          git push
