name: astock-etf-history

# 分散化研究用的场内 ETF 历史（不复权 + 后复权，算含分红收益）。
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-9l9paz]
    paths: ["scripts/astock_etf_history.py", ".github/workflows/astock-etf-history.yml"]

permissions:
  contents: write

jobs:
  etf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r astock/requirements.txt
      - run: python scripts/astock_etf_history.py
      - name: Commit results
        run: |
          git config user.name "astock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/etf
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "research: ETF history $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
