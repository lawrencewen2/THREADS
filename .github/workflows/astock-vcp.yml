name: astock-vcp

# 放在 9l9paz 分支上跑是为了用这里已有的完整业绩预告缓存，不再访问 baostock（2026-11-13 用户选择）。
# 米内尔维尼 VCP 叠加线上选股（2026-11-12 用户：把 Minervini 的 VCP 策略加入规则中）。只做研究，不改线上规则。
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-9l9paz]
    paths: ["astock/vcp_study.py", "scripts/astock_vcp_study.py", "tests/test_astock_vcp_study.py", ".github/workflows/astock-vcp.yml"]

permissions:
  contents: write

concurrency:
  group: astock-vcp
  cancel-in-progress: true

jobs:
  vcp:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r astock/requirements.txt pytest
      - run: python -m pytest -q tests/test_astock_vcp_study.py
      - name: Restore price cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: data/astock/cache
          key: astock-kline-diversify-fullfc
          restore-keys: astock-kline-
      - name: Stop if the full-forecast cache is gone (never refetch here)
        if: steps.restore.outputs.cache-matched-key != 'astock-kline-diversify-fullfc'
        run: exit 1
      - name: VCP study
        run: python scripts/astock_vcp_study.py
      - name: Commit results
        run: |
          git config user.name "astock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/astock/vcp_study.md docs/astock/vcp_study.json data/research/vcp_daily.csv.gz
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "astock: VCP study $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
