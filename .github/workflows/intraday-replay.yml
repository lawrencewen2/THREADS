name: intraday-replay

# 手动运行：用最近约 60 天的 15 分钟行情回放盘中估算，结果提交到 reports/intraday_replay.md
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/replay_intraday.py
      - name: Commit
        run: |
          git config user.name "fear-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/intraday_replay.md reports/intraday_replay.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "reports: intraday replay"
          git pull --rebase origin main
          git push
