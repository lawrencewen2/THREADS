name: intraday

on:
  schedule:
    # 北京时间（UTC+8）周一至周五。分钟错开整点，GitHub 整点的定时任务最容易延迟。
    # 08:07–16:22 亚洲盘中每 15 分钟
    - cron: "7,22,37,52 0-7 * * 1-5" 
    - cron: "7,22 8 * * 1-5"
    # 16:37–21:37 欧洲盘中每小时
    - cron: "37 8-13 * * 1-5"
    # 22:37–05:07 美股盘中每 30 分钟
    - cron: "37 14 * * 1-5"
    - cron: "7,37 15-20 * * 1-5"
    - cron: "7 21 * * 1-5"
  workflow_dispatch:
    inputs:
      loop:
        description: "开市期间循环运行（false = 只跑一次）"
        default: "true"

permissions:
  contents: write
  issues: write
  actions: write

# 有市场开着时一次运行会循环约 2 分钟算一次，最长约 5 小时 40 分钟，到时还在交易时段就再起一次自己。
# 运行中再被触发（定时或手动）的会排队等它结束，不会打断循环。
concurrency:
  group: intraday
  cancel-in-progress: false
 
jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check out intraday branch
        # 盘中读数存在单独的 intraday 分支，不往 main 上频繁提交
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" intraday > /dev/null; then
            git clone --depth 1 --branch intraday "$REMOTE" state
          else
            mkdir state && git -C state init -b intraday && git -C state remote add origin "$REMOTE"
          fi
      - name: Estimate (loop while any market is open)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "fear-index-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          start=$(date +%s)
          while :; do
            # 选股名单白天也会更新（收盘后），每轮取 main 上最新的一份
            git fetch -q --depth 1 origin main && git checkout -q FETCH_HEAD -- docs/astock/picks.json || echo "picks.json not refreshed"
            python scripts/run_intraday.py --out state || echo "::warning::run_intraday failed"
            (
              cd state
              git add -A
              if ! git diff --cached --quiet; then
                git commit -q -m "intraday: $(TZ=Asia/Shanghai date '+%F %H:%M')"
                git push -q origin intraday || { git pull -q --rebase origin intraday && git push -q origin intraday; } || echo "::warning::push failed"
              fi
            )
            elapsed=$(( $(date +%s) - start ))
            if [ "${{ inputs.loop }}" = "false" ] || [ $elapsed -gt 20400 ] || ! python scripts/run_intraday.py --any-open; then break; fi
            sleep 60
          done
          if [ $elapsed -gt 20400 ] && python scripts/run_intraday.py --any-open; then
            gh workflow run intraday.yml --ref main
          fi
