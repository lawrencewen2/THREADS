name: intraday

on:
  schedule:
    # 北京时间（UTC+8）周一至周五。分钟错开整点，GitHub 整点的定时任务最容易延迟。
    # 08:07–16:22 亚洲盘中每 15 分钟
    - cron: "7,22,37,52 0-7 * * 1-5"
    - cron: "7,22 8 * * 1-5"
    # 16:37–21:37 欧洲盘中每小时
    - cron: "37 8-13 * * 1-5"
    # 22:37–05:07 美股盘中每 30 分钟
    - cron: "37 14 * * 1-5"
    - cron: "7,37 15-20 * * 1-5"
    - cron: "7 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: intraday
  cancel-in-progress: true

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check out intraday branch
        # 盘中读数存在单独的 intraday 分支，不往 main 上频繁提交
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" intraday > /dev/null; then
            git clone --depth 1 --branch intraday "$REMOTE" state
          else
            mkdir state && git -C state init -b intraday && git -C state remote add origin "$REMOTE"
          fi
      - name: Estimate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/run_intraday.py --out state
      - name: Commit
        run: |
          cd state
          git config user.name "fear-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "intraday: $(TZ=Asia/Shanghai date '+%F %H:%M')"
          git push origin intraday
