name: astock-themes

# 单独检验主线行情板块（用 astock-insight 的行情缓存）。合进 main 后每天由 astock.yml 生成，这个只留作手动重跑。
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-sfpfl5]
    paths: ["astock/themes.py", "scripts/astock_themes.py", "tests/test_astock_themes.py", ".github/workflows/astock-themes.yml"]

permissions:
  contents: write

concurrency:
  group: astock-themes
  cancel-in-progress: false

jobs:
  themes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r astock/requirements.txt
      - run: python -m pytest -q tests/test_astock_themes.py
      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: data/astock/cache
          key: astock-insight-kline-${{ github.run_id }}
          restore-keys: astock-insight-kline-
      - name: Build themes
        run: python scripts/astock_themes.py --history 2025-10-31 2025-11-28 2025-12-31 2026-01-30 2026-03-31 2026-06-30 2026-08-31
      - name: Commit results
        run: |
          git config user.name "astock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/astock/concepts.csv docs/astock/themes.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "astock: themes $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
