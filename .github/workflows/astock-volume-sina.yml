name: astock-volume-sina

# 早盘放量快速版：新浪 60 分钟线（每只约一年，几分钟拉完），前一半训练、后一半样本外。
# baostock 长历史版在 astock-volume.yml（慢，要几个小时）。
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-55jhv3]
    paths: [".github/workflows/astock-volume-sina.yml", "scripts/astock_early_volume.py"]

permissions:
  contents: write

concurrency:
  group: astock-volume-sina
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r astock/requirements.txt requests
      - name: Restore daily kline cache
        uses: actions/cache/restore@v4
        with:
          path: data/astock/cache
          key: astock-kline-${{ github.run_id }}
          restore-keys: astock-kline-
      - run: python scripts/astock_early_volume.py --sina
      - name: Commit results
        run: |
          git config user.name "astock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/astock/early_volume_sina.md docs/astock/early_volume_sina.json reports/astock/early_volume_sina_rule.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "astock: early-volume quick study (sina) $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
