name: astock-t0

# 盘中做T研究：线上持仓 + 随机股票的 5 分钟线（baostock），只读日线缓存，结果写 reports/astock/t0.md。
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-uztfij]
    paths: ["astock/t0.py", "scripts/astock_t0.py", "tests/test_astock_t0.py", ".github/workflows/astock-t0.yml"]

permissions:
  contents: write

concurrency:
  group: astock-t0
  cancel-in-progress: false

jobs:
  t0:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r astock/requirements.txt
      - run: python -m pytest -q tests/test_astock_t0.py
      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: data/astock/cache
          key: astock-kline-${{ github.run_id }}
          restore-keys: astock-kline-
      - name: Restore 5-min cache
        uses: actions/cache/restore@v4
        with:
          path: data/astock/m5
          key: astock-m5-${{ github.run_id }}
          restore-keys: astock-m5-
      - name: Fetch 5-min bars
        timeout-minutes: 200
        run: python scripts/astock_t0.py --fetch-only
      - name: Save 5-min cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/astock/m5
          key: astock-m5-${{ github.run_id }}
      - name: Backtest
        run: python scripts/astock_t0.py --no-fetch
      - name: Commit results
        run: |
          git config user.name "astock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/astock/t0.md docs/astock/t0.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "astock: t0 study $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
