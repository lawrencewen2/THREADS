name: astock-stability

# 线上规则（业绩预期 + 情绪开关）的稳定性、控回撤和胜率检验。只读行情缓存，单独一个并发组。
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-pbwbl8]
    paths: ["astock/stability.py", "astock/winrate.py", "scripts/astock_stability.py", ".github/workflows/astock-stability.yml"]

permissions:
  contents: write

concurrency:
  group: astock-stability
  cancel-in-progress: false

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r astock/requirements.txt
      - run: python -m pytest -q tests/test_astock_alt_study.py
      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: data/astock/cache
          key: astock-kline-${{ github.run_id }}
          restore-keys: astock-kline-
      - name: Stability and win-rate study
        run: python scripts/astock_stability.py
      - name: Commit results
        run: |
          git config user.name "astock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/astock/stability.md reports/astock/winrate.md docs/astock/stability.json docs/astock/winrate.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "astock: stability study $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
