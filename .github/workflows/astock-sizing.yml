name: astock-sizing

# 动态仓位回测（2026-11-10 用户：仓位根据宏观、微观、基本面、技术面适时调整）。只做研究，不改线上规则。
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-exfcys]
    paths: ["astock/sizing.py", "scripts/astock_sizing.py", "tests/test_astock_sizing.py", ".github/workflows/astock-sizing.yml"]

permissions:
  contents: write

concurrency:
  group: astock-sizing
  cancel-in-progress: true

jobs:
  sizing:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r astock/requirements.txt
      - run: python -m pytest -q tests/test_astock_sizing.py
      - name: Restore price cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: data/astock/cache
          key: astock-kline-sizing-fullfc
          restore-keys: astock-kline-
      - name: Make sure forecasts go back to 2014
        if: steps.restore.outputs.cache-matched-key != 'astock-kline-sizing-fullfc'
        timeout-minutes: 40
        run: python scripts/astock_sizing.py --ensure-forecast
      - name: Save cache with full forecasts
        if: steps.restore.outputs.cache-matched-key != 'astock-kline-sizing-fullfc'
        uses: actions/cache/save@v4
        with:
          path: data/astock/cache
          key: astock-kline-sizing-fullfc
      - name: Sizing backtest
        run: python scripts/astock_sizing.py
      - name: Commit results
        run: |
          git config user.name "astock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/astock/sizing.md docs/astock/sizing.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "astock: sizing study $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
