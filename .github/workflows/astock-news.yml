name: astock-news

# 单独检验行情新闻抓取（不需要行情缓存，几分钟）。每天由 astock.yml 在选股之后一起更新。
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-sfpfl5]
    paths: ["astock/news.py", ".github/workflows/astock-news.yml"]

permissions:
  contents: write

concurrency:
  group: astock-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r astock/requirements.txt
      - name: Fetch news
        run: python scripts/astock_insight.py --news-only
      - name: Commit results
        run: |
          git config user.name "astock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/astock/news.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "astock: news $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
