name: daily-update

on:
  schedule:
    # 北京时间周一至周五 06:30，07:20 再跑一次备用（GitHub 定时常延迟一小时以上，重复运行无副作用）；
    # A股/港股开盘前更新，周一早上用的是上周五收盘数据
    - cron: "30 22 * * 0-4"
    - cron: "20 23 * * 0-4"
  workflow_dispatch:
    inputs:
      full:
        description: "重新拉取全部历史"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update index
        id: run
        run: python scripts/run_daily.py ${{ inputs.full && '--full' || '' }}
        continue-on-error: true
      - name: Verify data
        # 只报告不改数据：重算分数、核对发布文件、与第二数据源比对，结果写入 reports/verification.md
        run: python scripts/verify_data.py
        continue-on-error: true
      - name: Commit results
        run: |
          git config user.name "fear-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs README.md reports
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: daily update $(date -u +%F)"
          git push
      - name: Fail if checks failed
        if: steps.run.outcome == 'failure'
        run: exit 1
