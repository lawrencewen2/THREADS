name: daily-update

on:
  schedule:
    # 北京时间周一至周五 07:30（UTC 周日至周四 23:30），A股/港股开盘前更新；
    # 周一早上用的是上周五收盘数据
    - cron: "30 23 * * 0-4"
  workflow_dispatch:
    inputs:
      full:
        description: "重新拉取全部历史"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update index
        id: run
        run: python scripts/run_daily.py ${{ inputs.full && '--full' || '' }}
        continue-on-error: true
      - name: Commit results
        run: |
          git config user.name "fear-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs README.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: daily update $(date -u +%F)"
          git push
      - name: Fail if checks failed
        if: steps.run.outcome == 'failure'
        run: exit 1
